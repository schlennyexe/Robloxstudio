<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const SIZE = 512;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(SIZE, SIZE, false);
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
document.body.appendChild(renderer.domElement);
const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.03).texture;

// ---------------------------------------------------------------- Materialien
const mat = (color, o = {}) => new THREE.MeshPhysicalMaterial({
  color, roughness: 0.5, metalness: 0, clearcoat: 0.28, clearcoatRoughness: 0.35, envMapIntensity: 0.14, ...o });
const glassMat = (color, op = 0.42) => new THREE.MeshPhysicalMaterial({
  color, roughness: 0.08, metalness: 0, clearcoat: 1, transparent: true, opacity: op, envMapIntensity: 0.9, depthWrite: false });

const ext = (shape, depth, bevel = 0.09, seg = 5) => {
  const g = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: seg, curveSegments: 28 });
  g.center(); return g;
};
const mesh = (geo, m, x = 0, y = 0, z = 0) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); return o; };
const rbox = (w, h, d, r, m, x = 0, y = 0, z = 0) => mesh(new RoundedBoxGeometry(w, h, d, 6, r), m, x, y, z);
const poly = pts => { const s = new THREE.Shape(); pts.forEach(([x, y], i) => i ? s.lineTo(x, y) : s.moveTo(x, y)); s.closePath(); return s; };

// ---------------------------------------------------------------- Modelle
const MODELS = {};

MODELS.upgrades = () => {
  const g = new THREE.Group();
  const chev = poly([[-1, 0], [0, 0.82], [1, 0], [1, -0.44], [0, 0.4], [-1, -0.44]]);
  const geo = ext(chev, 0.5, 0.11);
  const dark = mat(0x1a8a30), top = mat(0x2bab3c);
  const a = mesh(geo, dark, 0, -0.62, 0); const b = mesh(geo, top, 0, 0.36, 0.06);
  g.add(a, b); g.rotation.set(0.42, -0.55, 0); return g;
};

MODELS.aufgaben = () => {
  const g = new THREE.Group();
  g.add(rbox(1.66, 2.1, 0.2, 0.12, mat(0x2270d6), 0, 0, -0.14));
  g.add(rbox(1.42, 1.86, 0.2, 0.1, mat(0xf1e2bd, { roughness: 0.55 }), 0, -0.02, 0.02));
  g.add(rbox(0.74, 0.34, 0.3, 0.12, mat(0xf0a020), 0, 0.98, 0.06));
  g.add(mesh(new THREE.TorusGeometry(0.12, 0.05, 10, 24), mat(0xd98a00), 0, 1.16, 0.06));
  for (let i = 0; i < 3; i++) {
    const y = 0.5 - i * 0.55;
    const curve = new THREE.CatmullRomCurve3([new THREE.Vector3(-0.56, y + 0.02, 0.2), new THREE.Vector3(-0.44, y - 0.12, 0.2), new THREE.Vector3(-0.2, y + 0.16, 0.2)]);
    g.add(mesh(new THREE.TubeGeometry(curve, 16, 0.075, 10), mat(0x2ed15a)));
    g.add(rbox(0.62, 0.15, 0.08, 0.05, mat(0x8aa9cf), 0.32, y, 0.16));
  }
  g.rotation.set(0.32, -0.5, 0.06); return g;
};

function flask(liquid, glass = 0xd9c8ff, rim = 0x6d3fd6) {
  const g = new THREE.Group();
  const prof = [[0.0, -0.98], [0.62, -0.94], [0.86, -0.78], [0.86, -0.6], [0.62, -0.1], [0.3, 0.4], [0.27, 0.62], [0.27, 1.02]];
  const pts = new THREE.SplineCurve(prof.map(p => new THREE.Vector2(p[0], p[1]))).getPoints(60).map(p => new THREE.Vector2(Math.max(0, p.x), p.y));
  const shell = mesh(new THREE.LatheGeometry(pts, 40), glassMat(glass, 0.36));
  const liqPts = pts.filter(p => p.y < -0.05).map(p => new THREE.Vector2(Math.max(0, p.x * 0.88), p.y * 0.98));
  liqPts.push(new THREE.Vector2(0, -0.02)); liqPts.unshift(new THREE.Vector2(0, -0.96));
  const liq = mesh(new THREE.LatheGeometry(liqPts.sort((a, b) => a.y - b.y), 40), mat(liquid, { roughness: 0.2 }));
  g.add(liq, shell);
  g.add(mesh(new THREE.TorusGeometry(0.29, 0.07, 12, 32), mat(rim), 0, 1.02, 0).rotateX(Math.PI / 2));
  g.add(mesh(new THREE.CylinderGeometry(0.22, 0.19, 0.32, 24), mat(0xc2833a, { roughness: 0.6 }), 0, 1.22, 0));
  for (const [x, y, z, r] of [[-0.2, -0.55, 0.3, 0.1], [0.22, -0.3, 0.25, 0.07], [0.1, -0.7, 0.4, 0.06]])
    g.add(mesh(new THREE.SphereGeometry(r, 16, 16), mat(0xffffff), x, y, z));
  g.rotation.set(0.25, -0.5, 0.12); return g;
}
MODELS.forschung = () => flask(0x5fd63f, 0xc0a8f0, 0x5a30b8);
MODELS.potion_g = () => flask(0x5ee65a, 0xd6ffd6, 0x1f9d3a);
MODELS.potion_y = () => flask(0xffc21a, 0xfff0c0, 0xc27a00);
MODELS.potion_p = () => flask(0xd05cff, 0xf0d4ff, 0x7a2cc0);

MODELS.shop = () => {
  const g = new THREE.Group();
  const body = poly([[-1.0, 0.5], [1.0, 0.5], [0.78, -0.55], [-0.78, -0.55]]);
  g.add(mesh(ext(body, 1.0, 0.1), mat(0xc8182f), 0, 0, 0));
  g.add(rbox(1.7, 0.09, 0.86, 0.04, mat(0x4a0814), 0, 0.6, 0));            // dunkle Öffnung
  g.add(rbox(2.06, 0.16, 1.16, 0.07, mat(0xe0405a), 0, 0.56, 0));           // Rand
  g.add(rbox(1.68, 0.14, 0.06, 0.03, mat(0x8e1226), 0, -0.12, 0.52));
  g.add(rbox(1.5, 0.14, 0.06, 0.03, mat(0x8e1226), 0, -0.36, 0.52));
  const arc = new THREE.EllipseCurve(0, 0, 0.92, 0.75, 0, Math.PI, false);
  const p3 = arc.getPoints(30).map(p => new THREE.Vector3(p.x, p.y + 0.6, 0));
  g.add(mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(p3), 40, 0.1, 12), mat(0xc9d3e6, { metalness: 0.5, roughness: 0.25 })));
  g.rotation.set(0.5, -0.6, 0.02); return g;
};

MODELS.rebirth = () => {
  const g = new THREE.Group();
  const base = mesh(new THREE.CylinderGeometry(0.9, 0.98, 0.2, 48), mat(0xdce8ff, { roughness: 0.5 }), 0, -0.66, 0);
  g.add(base);
  const ring = new THREE.Group();
  const arrow = (a0, a1) => {
    const R = 0.78, pts = [];
    for (let i = 0; i <= 24; i++) { const a = a0 + (a1 - a0) * i / 24; pts.push(new THREE.Vector3(Math.cos(a) * R, Math.sin(a) * R, 0)); }
    const m = mat(0xdc2b55);
    ring.add(mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 40, 0.22, 14), m));
    const H = 0.78, cone = mesh(new THREE.ConeGeometry(0.46, H, 28), m);
    const tx = -Math.sin(a1), ty = Math.cos(a1);                                // Laufrichtung
    cone.position.set(Math.cos(a1) * R + tx * H / 2, Math.sin(a1) * R + ty * H / 2, 0);
    cone.rotation.z = a1;                                                       // Spitze zeigt in Laufrichtung
    ring.add(cone);
    const cap = mesh(new THREE.SphereGeometry(0.22, 16, 16), m, Math.cos(a0) * R, Math.sin(a0) * R, 0); ring.add(cap);
  };
  arrow(Math.PI * 0.1, Math.PI * 0.78); arrow(Math.PI * 1.1, Math.PI * 1.78);
  ring.position.y = 0.42; ring.rotation.x = -0.15;
  g.add(ring); g.rotation.set(0.5, -0.4, 0); return g;
};

MODELS.index = () => {
  const g = new THREE.Group();
  const blue = mat(0x2660d8), navy = mat(0x163a94);
  g.add(rbox(1.36, 1.82, 0.1, 0.05, blue, 0, 0, -0.26));
  g.add(rbox(1.36, 1.82, 0.12, 0.05, blue, 0, 0, 0.26));
  g.add(rbox(0.16, 1.82, 0.62, 0.06, navy, -0.68, 0, 0));
  g.add(rbox(1.22, 1.66, 0.42, 0.04, mat(0xfff6dc, { roughness: 0.5 }), 0.02, 0, 0));
  const star = new THREE.Shape(); for (let i = 0; i < 10; i++) { const r = i % 2 ? 0.2 : 0.42, a = -Math.PI / 2 + i * Math.PI / 5; i ? star.lineTo(Math.cos(a) * r, Math.sin(a) * r) : star.moveTo(Math.cos(a) * r, Math.sin(a) * r); } star.closePath();
  g.add(mesh(ext(star, 0.06, 0.05), mat(0xffc21a, { metalness: 0.3 }), 0.02, 0.1, 0.36));
  g.add(rbox(0.2, 0.46, 0.04, 0.02, mat(0xff4757), 0.36, 0.86, 0.34));
  g.rotation.set(0.28, -0.7, 0.08); return g;
};

MODELS.drop_arcade = () => {
  // Arcade-Druckknopf: Metallsockel mit Goldring, große orange Taste mit weißem Pfeil nach unten
  const g = new THREE.Group();
  const metal = mat(0x8fa0c4, { metalness: 0.5, roughness: 0.3 });
  g.add(mesh(new THREE.CylinderGeometry(1.42, 1.55, 0.5, 64), metal, 0, -0.7, 0));
  g.add(mesh(new THREE.TorusGeometry(1.44, 0.1, 14, 72), mat(0xffc21a, { metalness: 0.4, roughness: 0.25 }), 0, -0.44, 0).rotateX(Math.PI / 2));
  for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3 + 0.3; g.add(mesh(new THREE.SphereGeometry(0.085, 12, 12), mat(0xdfe6f5, { metalness: 0.6 }), Math.cos(a) * 1.28, -0.5, Math.sin(a) * 1.28)); }
  const prof = [[0, -0.2], [1.02, -0.2], [1.06, 0.0], [1.06, 0.3], [0.98, 0.46], [0.8, 0.56], [0.45, 0.6], [0, 0.61]];
  const pts = new THREE.SplineCurve(prof.map(p => new THREE.Vector2(p[0], p[1]))).getPoints(70).map(p => new THREE.Vector2(Math.max(0, p.x), p.y));
  g.add(mesh(new THREE.LatheGeometry(pts, 64), mat(0xff4a12, { roughness: 0.22, clearcoat: 1, clearcoatRoughness: 0.1, emissive: 0xb02800, emissiveIntensity: 0.25 }), 0, -0.14, 0));
  const arrow = poly([[-0.3, 0.5], [0.3, 0.5], [0.3, 0.05], [0.62, 0.05], [0, -0.55], [-0.62, 0.05], [-0.3, 0.05]]);
  const ar = mesh(ext(arrow, 0.1, 0.05, 3), mat(0xffffff, { roughness: 0.25 }), 0, 0.64, 0.02);
  ar.rotation.x = -Math.PI / 2; g.add(ar);
  g.rotation.set(0.5, -0.25, 0); return g;
};

MODELS.nut = () => {
  const s = new THREE.Shape(); for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; i ? s.lineTo(Math.cos(a), Math.sin(a)) : s.moveTo(Math.cos(a), Math.sin(a)); } s.closePath();
  const h = new THREE.Path(); h.absarc(0, 0, 0.4, 0, Math.PI * 2, true); s.holes.push(h);
  const g = new THREE.Group(); g.add(mesh(ext(s, 0.5, 0.1), mat(0xf5a814, { metalness: 0.4, roughness: 0.3 })));
  g.rotation.set(0.85, -0.35, 0.1); return g;
};

MODELS.gear = () => {
  const s = new THREE.Shape(); const N = 8;
  for (let i = 0; i < N; i++) { const a = i * 2 * Math.PI / N, w = Math.PI / N;
    const pts = [[0.62, a - w * 0.9], [1.0, a - w * 0.38], [1.0, a + w * 0.38], [0.62, a + w * 0.9]];
    pts.forEach(([r, t], k) => { const x = Math.cos(t) * r, y = Math.sin(t) * r; (i === 0 && k === 0) ? s.moveTo(x, y) : s.lineTo(x, y); }); }
  s.closePath(); const h = new THREE.Path(); h.absarc(0, 0, 0.32, 0, Math.PI * 2, true); s.holes.push(h);
  const g = new THREE.Group(); g.add(mesh(ext(s, 0.42, 0.09), mat(0xa468ff, { metalness: 0.2 })));
  g.rotation.set(0.85, -0.35, 0.1); return g;
};

MODELS.clover = () => {
  const g = new THREE.Group();
  const heart = new THREE.Shape(); heart.moveTo(0, 0);
  heart.bezierCurveTo(-0.32, 0.16, -0.54, 0.6, -0.3, 0.84); heart.bezierCurveTo(-0.14, 1.0, 0, 0.86, 0, 0.72);
  heart.bezierCurveTo(0, 0.86, 0.14, 1.0, 0.3, 0.84); heart.bezierCurveTo(0.54, 0.6, 0.32, 0.16, 0, 0);
  const geo = new THREE.ExtrudeGeometry(heart, { depth: 0.22, bevelEnabled: true, bevelThickness: 0.07, bevelSize: 0.06, bevelSegments: 4, curveSegments: 24 });
  for (let k = 0; k < 4; k++) { const m = mesh(geo, mat(k % 2 ? 0x1f9a2e : 0x2bb23a)); m.rotation.z = k * Math.PI / 2; g.add(m); }
  const stem = new THREE.CatmullRomCurve3([new THREE.Vector3(0, 0, 0.05), new THREE.Vector3(0.1, -0.5, 0.05), new THREE.Vector3(0.4, -0.85, 0.05)]);
  g.add(mesh(new THREE.TubeGeometry(stem, 20, 0.07, 10), mat(0x2aa63a)));
  g.rotation.set(0.35, -0.4, 0); return g;
};

MODELS.lock = () => {
  const g = new THREE.Group();
  g.add(rbox(1.5, 1.15, 0.66, 0.16, mat(0xffc21a, { metalness: 0.3, roughness: 0.25 }), 0, -0.2, 0));
  const sh = mesh(new THREE.TorusGeometry(0.46, 0.13, 14, 40, Math.PI), mat(0xd3dbe9, { metalness: 0.6, roughness: 0.2 }), 0, 0.36, 0);
  g.add(sh, rbox(0.26, 0.4, 0.26, 0.05, mat(0xd3dbe9, { metalness: 0.6 }), -0.46, 0.2, 0), rbox(0.26, 0.4, 0.26, 0.05, mat(0xd3dbe9, { metalness: 0.6 }), 0.46, 0.2, 0));
  g.add(mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.06, 20), mat(0x4a2c00), 0, -0.1, 0.34).rotateX(Math.PI / 2));
  g.add(rbox(0.1, 0.32, 0.06, 0.03, mat(0x4a2c00), 0, -0.34, 0.34));
  g.rotation.set(0.25, -0.5, 0); return g;
};

MODELS.star = () => {
  const s = new THREE.Shape(); for (let i = 0; i < 10; i++) { const r = i % 2 ? 0.45 : 1, a = -Math.PI / 2 + i * Math.PI / 5; i ? s.lineTo(Math.cos(a) * r, Math.sin(a) * r) : s.moveTo(Math.cos(a) * r, Math.sin(a) * r); } s.closePath();
  const g = new THREE.Group(); g.add(mesh(ext(s, 0.3, 0.12), mat(0xffc21a, { metalness: 0.3, roughness: 0.22 })));
  g.rotation.set(0.3, -0.4, 0.05); return g;
};



MODELS.teleport = () => {
  const g = new THREE.Group();
  g.add(mesh(new THREE.CylinderGeometry(1.15, 1.25, 0.24, 48), mat(0x3d4868, { roughness: 0.5 }), 0, -0.95, 0));
  g.add(mesh(new THREE.CylinderGeometry(1.0, 1.05, 0.1, 48), mat(0x2fe0d0, { emissive: 0x0aa0a0, emissiveIntensity: 0.6 }), 0, -0.8, 0));
  const ring = mesh(new THREE.TorusGeometry(0.95, 0.2, 24, 64), mat(0x3a72e0, { roughness: 0.35 }), 0, 0.15, 0);
  g.add(ring);
  const disc = mesh(new THREE.CircleGeometry(0.85, 48), new THREE.MeshPhysicalMaterial({ color: 0x66f0ff, emissive: 0x22c8ff, emissiveIntensity: 0.7, roughness: 0.2, side: THREE.DoubleSide, transparent: true, opacity: 0.9 }), 0, 0.15, 0);
  g.add(disc);
  for (const [x, y, r] of [[-0.3, 0.45, 0.13], [0.35, -0.05, 0.1], [0.05, 0.05, 0.16]]) g.add(mesh(new THREE.SphereGeometry(r, 16, 16), mat(0xffffff, { emissive: 0xffffff, emissiveIntensity: 0.7 }), x, y, 0.05));
  for (const s of [-1, 1]) g.add(rbox(0.26, 0.5, 0.26, 0.06, mat(0x2f6ae0), s * 0.95, -0.55, 0));
  g.rotation.set(0.28, -0.5, 0); return g;
};

// ---------------------------------------------------------------- Bots (je einer pro Seltenheit), Körper in Seltenheitsfarbe
const eyes = (g, y, z, sep = 0.28, r = 0.17, col = 0xffffff) => {
  for (const s of [-1, 1]) {
    g.add(mesh(new THREE.SphereGeometry(r, 20, 20), mat(col, { roughness: 0.15 }), s * sep, y, z));
    g.add(mesh(new THREE.SphereGeometry(r * 0.55, 16, 16), mat(0x111827), s * sep, y - 0.01, z + r * 0.62));
    g.add(mesh(new THREE.SphereGeometry(r * 0.2, 8, 8), mat(0xffffff), s * sep + r * 0.15, y + r * 0.2, z + r * 1.05));
  }
};
const cone = (r, h, m, x, y, z) => mesh(new THREE.ConeGeometry(r, h, 24), m, x, y, z);
const cyl = (rt, rb, h, m, x, y, z) => mesh(new THREE.CylinderGeometry(rt, rb, h, 28), m, x, y, z);
const finish = (g, ry = -0.35, rx = 0.18) => { g.rotation.set(rx, ry, 0); return g; };

MODELS.bot_toaster = () => {
  const g = new THREE.Group(), body = mat(0xb7c0d4, { metalness: 0.3, roughness: 0.28 });
  g.add(rbox(1.6, 1.15, 0.95, 0.24, body, 0, 0, 0));
  for (const s of [-1, 1]) {
    g.add(rbox(0.5, 0.05, 0.18, 0.02, mat(0x30364a), s * 0.34, 0.585, 0));
    g.add(rbox(0.4, 0.5, 0.12, 0.07, mat(0xe9b458, { roughness: 0.6 }), s * 0.34, 0.78, 0));
    g.add(rbox(0.22, 0.14, 0.3, 0.05, mat(0x30364a), s * 0.4, -0.66, 0.1));
  }
  g.add(rbox(0.14, 0.34, 0.14, 0.05, mat(0xef4444), 0.86, 0.1, 0));
  eyes(g, 0.02, 0.48, 0.3, 0.19);
  g.add(rbox(0.3, 0.07, 0.05, 0.03, mat(0x30364a), 0, -0.3, 0.5));
  return finish(g);
};

MODELS.bot_wecker = () => {
  const g = new THREE.Group(), body = mat(0x4ade80);
  const c = cyl(0.8, 0.8, 0.62, body, 0, 0, 0); c.rotation.x = Math.PI / 2; g.add(c);
  const f = cyl(0.62, 0.62, 0.08, mat(0xfffaf0, { roughness: 0.4 }), 0, 0, 0.33); f.rotation.x = Math.PI / 2; g.add(f);
  for (const s of [-1, 1]) {
    g.add(mesh(new THREE.SphereGeometry(0.3, 24, 16, 0, Math.PI * 2, 0, Math.PI / 2), mat(0x1f9d4a), s * 0.5, 0.72, 0));
    g.add(cyl(0.08, 0.08, 0.3, mat(0x1f9d4a), s * 0.66, -0.66, 0.1));
  }
  g.add(cyl(0.05, 0.05, 0.34, mat(0x30364a), 0, 0.98, 0));
  eyes(g, 0.1, 0.4, 0.24, 0.13, 0xffffff);
  g.add(rbox(0.06, 0.34, 0.03, 0.01, mat(0x30364a), 0, -0.14, 0.38));
  return finish(g);
};

MODELS.bot_katze = () => {
  const g = new THREE.Group(), body = mat(0x38bdf8);
  const head = mesh(new THREE.SphereGeometry(0.85, 40, 32), body); head.scale.set(1.15, 0.95, 0.95); g.add(head);
  for (const s of [-1, 1]) {
    const e = cone(0.34, 0.6, body, s * 0.62, 0.78, 0); e.rotation.z = -s * 0.32; g.add(e);
    g.add(cone(0.2, 0.36, mat(0xffa6c9), s * 0.62, 0.74, 0.1).rotateZ(-s * 0.32));
    for (let k = 0; k < 3; k++) { const w = cyl(0.014, 0.014, 0.7, mat(0xe8f4ff), s * 0.85, -0.05 - k * 0.09, 0.66); w.rotation.z = Math.PI / 2 + s * (k - 1) * 0.16; g.add(w); }
  }
  eyes(g, 0.12, 0.72, 0.36, 0.2, 0xd8ff5a);
  g.add(mesh(new THREE.SphereGeometry(0.09, 12, 12), mat(0xff7aa8), 0, -0.14, 0.86));
  g.add(mesh(new THREE.SphereGeometry(0.13, 16, 16), mat(0xffd23f, { metalness: 0.4 }), 0, -0.82, 0.55));
  const tail = new THREE.CatmullRomCurve3([new THREE.Vector3(0.7, -0.5, -0.2), new THREE.Vector3(1.3, -0.3, -0.2), new THREE.Vector3(1.4, 0.3, -0.2)]);
  g.add(mesh(new THREE.TubeGeometry(tail, 20, 0.11, 10), body));
  return finish(g, -0.3, 0.12);
};

MODELS.bot_feuerwehr = () => {
  const g = new THREE.Group(), body = mat(0xa78bfa);
  g.add(rbox(1.35, 1.25, 0.95, 0.28, body, 0, -0.1, 0));
  g.add(mesh(new THREE.SphereGeometry(0.78, 32, 20, 0, Math.PI * 2, 0, Math.PI / 2), mat(0xffc21a), 0, 0.5, 0));
  g.add(cyl(0.9, 0.9, 0.08, mat(0xf5a800), 0, 0.5, 0.05));

// ---------------------------------------------------------------- Rendern
window.renderIcon = (name, fill = 0.86, yShift = 0) => {
  const scene = new THREE.Scene();
  scene.environment = envTex;
  const group = MODELS[name]();
  scene.add(group);
  scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x2c2850, 0.42));
  const key = new THREE.DirectionalLight(0xfff0dc, 2.25); key.position.set(-3, 5, 5); scene.add(key);
  const rim = new THREE.DirectionalLight(0x9ec8ff, 0.8); rim.position.set(4, 2, -3); scene.add(rim);
  const fillL = new THREE.DirectionalLight(0xffe8d0, 0.12); fillL.position.set(4, -1, 4); scene.add(fillL);
  const box = new THREE.Box3().setFromObject(group);
  const size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
  const k = 2.2 * fill / Math.max(size.x, size.y);
  group.scale.setScalar(k); group.position.sub(center.multiplyScalar(k)); group.position.y += yShift;
  const cam = new THREE.PerspectiveCamera(20, 1, 0.1, 100);
  const d = 1.1 / Math.tan(THREE.MathUtils.degToRad(10)); cam.position.set(0, 0, d); cam.lookAt(0, 0, 0);
  renderer.setClearColor(0x000000, 0); renderer.clear();
  renderer.render(scene, cam);
  const url = renderer.domElement.toDataURL('image/png');
  scene.traverse(o => { if (o.geometry) o.geometry.dispose(); });
  return url;
};
